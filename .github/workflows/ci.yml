name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: shellcheck --version
      - run: bash scripts/check-all.sh
  tag-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tag matches plugin.json version
        run: |
          v="v$(jq -r .version .claude-plugin/plugin.json)"
          [ "$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != plugin.json $v"; exit 1; }
